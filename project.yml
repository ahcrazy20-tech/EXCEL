name: SheetX
options:
  bundleIdPrefix: com.sheetx
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Keep the .pbxproj readable by Xcode 14/15 runners (objectVersion 77 = Xcode 16 only).
  objectVersion: 54
  xcodeVersion: "15.4"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: "0.9.19"

settings:
  base:
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  SheetX:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ZIPFoundation
      - sdk: libsqlite3.tbd
    info:
      path: Sources/Support/Info.plist
      properties:
        CFBundleDisplayName: SheetX
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Spreadsheet
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - org.openxmlformats.spreadsheetml.sheet
              - org.openxmlformats.spreadsheetml.sheet.macroenabled
              - org.openxmlformats.spreadsheetml.template
              - org.openxmlformats.spreadsheetml.template.macroenabled
              - com.microsoft.excel.xls
              - public.comma-separated-values-text
              - public.tab-separated-values-text
              - public.json
              - public.plain-text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sheetx.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO

  SheetXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SheetX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  SheetXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SheetX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SheetX

schemes:
  SheetX:
    build:
      targets:
        SheetX: all
    test:
      targets:
        - SheetXTests
        - SheetXUITests
